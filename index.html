<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>왜 한국이었나요?</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one calm column. A dashed flight path across the top carries a small plane from 출발 to 도착, one question per leg. */
:root{
  --bg:#EEF7FA; --bg-2:#DDEFF5; --surface:#FFFFFF; --ink:#14313D; --muted:#58737F; --line:#D3E4EA;
  --accent:#12957E; --accent-ink:#0B6B5A; --accent-soft:#DDF4EE; --on-accent:#FFFFFF;
  --sun:#F4B63F; --sun-soft:#FFF2D2; --on-sun:#3A2A05; --coral:#E3644F; --coral-soft:#FDE9E5;
  --c-VN:#d94841; --c-CN:#d9871c; --c-MN:#3576d6; --c-NP:#8b5bd6; --c-ETC:#7b8f98;
  --shadow:0 8px 28px rgba(20,49,61,.08);
  --font-body:'Be Vietnam Pro','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
  --font-display:'Gowun Dodum','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1D24; --bg-2:#13303A; --surface:#172C36; --ink:#E7F2F5; --muted:#9AB3BD; --line:#2B4653;
  --accent:#3CC9AF; --accent-ink:#7FE0CD; --accent-soft:#16393A; --on-accent:#06231D;
  --sun:#F4B63F; --sun-soft:#3A2F14; --on-sun:#3A2A05; --coral:#F08878; --coral-soft:#3B211D;
  --c-VN:#ef6a62; --c-CN:#eda03c; --c-MN:#5b97ee; --c-NP:#a583ea; --c-ETC:#9fb2ba;
  --shadow:0 8px 28px rgba(0,0,0,.35); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0E1D24; --bg-2:#13303A; --surface:#172C36; --ink:#E7F2F5; --muted:#9AB3BD; --line:#2B4653;
  --accent:#3CC9AF; --accent-ink:#7FE0CD; --accent-soft:#16393A; --on-accent:#06231D;
  --sun:#F4B63F; --sun-soft:#3A2F14; --on-sun:#3A2A05; --coral:#F08878; --coral-soft:#3B211D;
  --c-VN:#ef6a62; --c-CN:#eda03c; --c-MN:#5b97ee; --c-NP:#a583ea; --c-ETC:#9fb2ba;
  --shadow:0 8px 28px rgba(0,0,0,.35); color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{background:radial-gradient(900px 360px at 50% -80px,var(--bg-2),transparent 70%),var(--bg);background-attachment:fixed;color:var(--ink);
  font-family:var(--font-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

.app{min-height:100%;max-width:660px;margin:0 auto;display:flex;flex-direction:column;gap:14px;
  padding-block:14px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app:lang(en),.app:lang(vi){--font-display:'Be Vietnam Pro',system-ui,sans-serif}
.app:lang(zh){--font-display:'PingFang SC','Microsoft YaHei','Noto Sans SC',system-ui,sans-serif}

.ribbon{background:var(--sun-soft);color:var(--ink);border:1px dashed var(--sun);border-radius:12px;padding:8px 12px;font-size:13px;text-align:center}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-size:17px;color:var(--ink);min-width:0}
.brand svg{flex:none;color:var(--accent)}
.langs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.langs button{border:0;background:transparent;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;min-height:32px}
.langs button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}

/* flight path */
.route{display:flex;flex-direction:column;gap:2px}
.route svg{display:block;width:100%;height:auto;overflow:visible}
.route .track{fill:none;stroke:var(--line);stroke-width:2.5;stroke-dasharray:1 9;stroke-linecap:round}
.route .prog{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linecap:round}
.route .wp{fill:var(--surface);stroke:var(--line);stroke-width:2}
.route .wp.done{fill:var(--accent);stroke:var(--accent)}
.route .wp.cur{fill:var(--sun);stroke:var(--sun)}
.route .end{fill:var(--ink)}
.route .plane{fill:var(--accent);stroke:var(--surface);stroke-width:1.5;stroke-linejoin:round}
.route-meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);letter-spacing:.04em}
.route-meta b{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600;letter-spacing:0}

/* card */
.stage{flex:1;display:flex;flex-direction:column}
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:26px 24px;display:flex;flex-direction:column;gap:16px}
@media (max-width:480px){.card{padding:22px 16px;border-radius:20px}}
.kicker{font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--accent-ink);font-variant-numeric:tabular-nums}
.card h1,.card h2{font-family:var(--font-display);font-weight:400;margin:0;line-height:1.35;text-wrap:balance;word-break:keep-all;outline:none}
.card h1{font-size:clamp(26px,6.4vw,34px)}
.card h2{font-size:clamp(21px,5vw,26px)}
.app:lang(en) .card h1,.app:lang(vi) .card h1,.app:lang(en) .card h2,.app:lang(vi) .card h2{font-weight:600;letter-spacing:-.01em;line-height:1.25}
.app:lang(zh) .card h1,.app:lang(zh) .card h2{font-weight:600}
.hint{margin:0;color:var(--muted);font-size:14.5px}
.mini{margin:0;color:var(--muted);font-size:13px}
.lead{margin:0;font-size:16px;max-width:60ch}

/* intro */
.facts{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0}
.facts li{background:var(--accent-soft);color:var(--accent-ink);border-radius:999px;padding:5px 13px;font-size:13.5px;font-weight:600}
.notice{border-left:3px solid var(--sun);padding:2px 0 2px 14px;display:flex;flex-direction:column;gap:6px}
.notice p{margin:0;font-size:14px;color:var(--muted)}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;cursor:pointer;font-size:15px}
.check input{appearance:none;-webkit-appearance:none;flex:none;width:24px;height:24px;margin:1px 0 0;border:2px solid var(--line);border-radius:7px;background:var(--surface);display:grid;place-items:center;cursor:pointer}
.check input:checked{background:var(--accent);border-color:var(--accent)}
.check input:checked::after{content:"";width:11px;height:6px;border-left:2.5px solid var(--on-accent);border-bottom:2.5px solid var(--on-accent);transform:rotate(-45deg) translate(1px,-1px)}
.check:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}

/* options */
.opts{display:grid;gap:10px}
.opts.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:420px){.opts.grid2{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;text-align:left;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);
  background:var(--surface);font-weight:500;cursor:pointer;transition:border-color .15s,background-color .15s,transform .12s,opacity .15s;min-width:0}
.opt:hover{border-color:var(--accent)}
.opt:active{transform:scale(.985)}
.opt-t{flex:1;min-width:0;overflow-wrap:anywhere}
.opt[aria-checked="true"],.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt .dot{flex:none;width:12px;height:12px;border-radius:4px}
.opt .tick{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center}
.opt[aria-checked="true"] .tick{background:var(--accent);border-color:var(--accent)}
.opt[aria-checked="true"] .tick::after{content:"";width:10px;height:5px;border-left:2px solid var(--on-accent);border-bottom:2px solid var(--on-accent);transform:rotate(-45deg) translate(1px,-1px)}
.opt .badge{flex:none;min-width:50px;height:28px;padding:0 8px;border-radius:999px;border:1.5px dashed var(--line);display:grid;place-items:center;font-size:12.5px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.opt[aria-pressed="true"] .badge{background:var(--sun);border:1.5px solid var(--sun);color:var(--on-sun)}
.opt.dim{opacity:.5}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:8px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:500;cursor:pointer;transition:border-color .15s,background-color .15s}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.sub{display:flex;flex-direction:column;gap:12px;padding-top:4px}
.sub-label{margin:0;font-size:14.5px;font-weight:600}
.sub-label small{font-weight:400;color:var(--muted);font-size:13px}
.field{width:100%;min-height:48px;padding:11px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface)}
textarea.field{min-height:76px;resize:vertical;line-height:1.5}
.field:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field::placeholder{color:var(--muted);opacity:.75}

/* timeline (q3) */
.year-read{font-family:var(--font-display);font-size:46px;line-height:1;color:var(--accent-ink);font-variant-numeric:tabular-nums;min-height:46px}
.year-read.empty{color:var(--line)}
.tl{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));position:relative}
.tl::before{content:"";position:absolute;left:calc(100%/14);right:calc(100%/14);top:20px;height:3px;border-radius:3px;background:var(--line)}
.tl-fill{position:absolute;left:calc(100%/14);top:20px;height:3px;border-radius:3px;background:var(--accent);width:0;transition:width .3s ease}
.tl button{position:relative;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px 0 4px;cursor:pointer;color:var(--muted);min-width:0}
.tl i{width:26px;height:26px;border-radius:50%;background:var(--surface);border:3px solid var(--line);transition:transform .18s,background-color .18s,border-color .18s,box-shadow .18s}
.tl button.past i{border-color:var(--accent)}
.tl button[aria-checked="true"] i{background:var(--accent);border-color:var(--accent);transform:scale(1.18);box-shadow:0 0 0 6px var(--accent-soft)}
.tl span{font-size:12px;font-variant-numeric:tabular-nums;text-align:center;line-height:1.25}
.tl button[aria-checked="true"] span{color:var(--ink);font-weight:700}

/* sliders */
.sls{display:flex;flex-direction:column;gap:18px}
.sl{display:flex;flex-direction:column;gap:4px}
.sl-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.sl-name{font-weight:600;font-size:15px}
.sl-val{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.sl-val.set{color:var(--ink);font-weight:600}
.rng{-webkit-appearance:none;appearance:none;width:100%;height:34px;margin:0;background:transparent;cursor:pointer;--p:50%;--fill:var(--accent)}
.rng::-webkit-slider-runnable-track{height:8px;border-radius:99px;background:linear-gradient(to right,var(--fill) var(--p),var(--line) var(--p))}
.rng::-moz-range-track{height:8px;border-radius:99px;background:var(--line)}
.rng::-moz-range-progress{height:8px;border-radius:99px;background:var(--fill)}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:-10px;border-radius:50%;background:var(--surface);border:4px solid var(--fill);box-shadow:0 2px 6px rgba(20,49,61,.25);transition:transform .12s}
.rng::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--surface);border:4px solid var(--fill);box-shadow:0 2px 6px rgba(20,49,61,.25)}
.rng:active::-webkit-slider-thumb{transform:scale(1.12)}
.rng.untouched{--fill:var(--muted)}
.rng.untouched::-webkit-slider-runnable-track{background:var(--line)}
.rng.untouched::-moz-range-progress{background:var(--line)}
.rng.untouched::-webkit-slider-thumb{border-style:dashed;opacity:.75}
.scale{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;padding:0 9px}
.nps-read{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.nps-num{font-family:var(--font-display);font-size:64px;line-height:1;font-variant-numeric:tabular-nums;color:var(--line);min-width:1.2ch}
.nps-num.set{color:var(--ink)}
.nps-word{font-size:15px;font-weight:600;color:var(--muted)}

/* nav */
.nav{position:sticky;bottom:0;display:flex;flex-direction:column;gap:6px;padding-block:10px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 72%,transparent)}
.nav-hint{min-height:20px;margin:0;font-size:13px;color:var(--muted);text-align:center}
.nav-hint.warn{color:var(--coral);font-weight:600}
.nav-row{display:flex;gap:10px}
.btn{min-height:50px;padding:0 20px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;transition:transform .12s,opacity .15s,background-color .15s}
.btn:active{transform:scale(.98)}
.btn.primary{flex:1;background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn[aria-disabled="true"]{opacity:.45}
.btn.wide{width:100%}

/* done */
.done{align-items:center;text-align:center;padding-block:34px}
.stamp{width:150px;height:150px;color:var(--accent)}
.stamp text{font-family:var(--font-body);font-weight:700;fill:currentColor}
.alert{background:var(--coral-soft);border:1px solid var(--coral);border-radius:12px;padding:10px 14px;font-size:14px;margin:0}

.foot{font-size:12px;color:var(--muted);text-align:center;padding-bottom:10px}

@media (prefers-reduced-motion: no-preference){
  .card.enter{animation:enter .32s cubic-bezier(.2,.7,.2,1) both}
  .card.enter.rev{animation-name:enterRev}
  .pop{animation:pop .28s ease}
  .shake{animation:shake .3s ease}
  .stamp{animation:stamp .5s cubic-bezier(.2,1.4,.4,1) both}
}
@keyframes enter{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes enterRev{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
@keyframes pop{40%{transform:scale(1.035)}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes stamp{from{opacity:0;transform:scale(1.7) rotate(-22deg)}to{opacity:1;transform:rotate(-8deg)}}
.stamp{transform:rotate(-8deg)}
</style>
</head>
<body>
<div class="app" id="app" lang="ko">
  <div class="ribbon" id="ribbon" hidden></div>

  <header class="top">
    <div class="brand">
      <svg width="20" height="20" viewBox="-12 -10 24 20" aria-hidden="true"><path d="M-10 -7 L11 0 L-10 7 L-5 0 Z" fill="currentColor"/></svg>
      <span id="brand"></span>
    </div>
    <div class="langs" id="langs" role="group" aria-label="Language">
      <button type="button" data-lang="ko">한국어</button>
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="vi">VI</button>
      <button type="button" data-lang="zh">中文</button>
    </div>
  </header>

  <div class="route" id="route" hidden>
    <svg viewBox="0 0 600 62" aria-hidden="true">
      <path class="track" d="M16 48 Q300 -12 584 48"/>
      <path class="prog" id="routeProg" d="M16 48"/>
      <g id="routeDots"></g>
      <circle class="end" cx="16" cy="48" r="5"/><circle class="end" cx="584" cy="48" r="5"/>
      <path class="plane" id="plane" d="M-10 -7 L11 0 L-10 7 L-5 0 Z"/>
    </svg>
    <div class="route-meta"><span id="rDep"></span><b id="rCount"></b><span id="rArr"></span></div>
  </div>

  <main class="stage" id="stage"></main>

  <nav class="nav" id="nav" hidden>
    <p class="nav-hint" id="navHint" role="status"></p>
    <div class="nav-row">
      <button type="button" class="btn" id="btnBack"></button>
      <button type="button" class="btn primary" id="btnNext"></button>
    </div>
  </nav>

  <footer class="foot" id="foot"></footer>
</div>

<script src="config.js"></script>

function missing(step){

    case 'q1': return !A.q1 ? 'need_pick' : (A.q1 === 'ETC' && !txt(A.q1_other)) ? 'need_text' : '';
    case 'q2': return !A.q2 ? 'need_pick' : (A.q2 === 'other' && !txt(A.q2_other)) ? 'need_text' : '';
    case 'q3': return A.q3 ? '' : 'need_pick';
    case 'q4': return q4opts().indexOf(A.q4) >= 0 ? '' : 'need_pick';
    case 'q5': return !(A.q5 && A.q5.length) ? 'need_rank' : (A.q5.indexOf('other') >= 0 && !txt(A.q5_other)) ? 'need_text' : '';
    case 'q6': return !A.q6 ? 'need_pick' : (A.q6 === 'other' && !txt(A.q6_other)) ? 'need_text' : '';
    case 'q7': return !A.q7_gate ? 'need_pick' : A.q7_gate === 'only' ? '' : !(A.q7 && A.q7.length) ? 'need_multi' : (A.q7.indexOf('other') >= 0 && !txt(A.q7_other)) ? 'need_text' : '';
    case 'q8': return Q8.every(function(k){ return isNum(A['q8_' + k]); }) ? '' : 'need_sliders';
    case 'q9': return !A.q9 ? 'need_pick' : (A.q9 === 'other' && !txt(A.q9_other)) ? 'need_text' : (A.q9 !== 'unsure' && !isNum(A.q9_sure)) ? 'need_slider' : '';
    case 'q10': return isNum(A.q10) ? '' : 'need_slider';
    case 'q11': return '';
  }
  return '';
}

    var p = bez(frac(i));
    var c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c.setAttribute('class', 'wp'); c.setAttribute('cx', p[0]); c.setAttribute('cy', p[1]); c.setAttribute('r', 4.5);
    g.append(c);
  }
})();
function drawRoute(f){
  var p = bez(f), a = bez(Math.max(0, f - 0.01)), b = bez(Math.min(1, f + 0.01));
  var ang = Math.atan2(b[1] - a[1], b[0] - a[0]) * 180 / Math.PI;
  $('#plane').setAttribute('transform', 'translate(' + p[0].toFixed(1) + ' ' + (p[1] - 9).toFixed(1) + ') rotate(' + ang.toFixed(1) + ')');
  var c = [P0[0] + (P1[0] - P0[0]) * f, P0[1] + (P1[1] - P0[1]) * f];   // de Casteljau: 0..f 구간
  $('#routeProg').setAttribute('d', 'M' + P0[0] + ' ' + P0[1] + ' Q' + c[0].toFixed(1) + ' ' + c[1].toFixed(1) + ' ' + p[0].toFixed(1) + ' ' + p[1].toFixed(1));
}
function setRoute(step){
  var target = frac(step), from = routeF;
  document.querySelectorAll('#routeDots .wp').forEach(function(d, i){
    d.setAttribute('class', 'wp' + (i < step ? ' done' : i === step ? ' cur' : ''));
  });
  cancelAnimationFrame(routeAnim);
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce || from === target) { routeF = target; drawRoute(target); return; }
  var t0 = performance.now();
  (function tick(now){
    var k = Math.min(1, (now - t0) / 520), e = 1 - Math.pow(1 - k, 3);
    routeF = from + (target - from) * e;
    drawRoute(routeF);
    if (k < 1) routeAnim = requestAnimationFrame(tick);
  })(t0);
}

/* ───────────── 화면 ───────────── */
var stage = $('#stage'), nav = $('#nav'), navHint = $('#navHint'), btnBack = $('#btnBack'), btnNext = $('#btnNext');
var flashTimer = 0;

function flash(msg){
  clearTimeout(flashTimer);
  navHint.textContent = msg; navHint.classList.add('warn');
  flashTimer = setTimeout(refreshNav, 2200);
}
function refreshNav(){
  if (view !== 'flow' || S.step < 0 || S.step >= NQ) return;
  clearTimeout(flashTimer);
  var m = missing(S.step);
  btnNext.setAttribute('aria-disabled', String(!!m));
  navHint.classList.remove('warn');
  navHint.textContent = m ? t(m) : '';
}
function chrome(){
  var app = $('#app');
  app.setAttribute('lang', S.lang);
  document.documentElement.setAttribute('lang', S.lang);
  $('#brand').textContent = t('brand');
  document.querySelectorAll('#langs button').forEach(function(b){ b.setAttribute('aria-pressed', String(b.getAttribute('data-lang') === S.lang)); });
  var rib = $('#ribbon'); rib.hidden = !PREVIEW; rib.textContent = t('preview');
  $('#rDep').textContent = t('depart'); $('#rArr').textContent = t('arrive');
  btnBack.textContent = t('back');
  var foot = [];
  if (CFG.ORGANIZER) foot.push(t('organizer') + ': ' + CFG.ORGANIZER);
  if (CFG.CONTACT) foot.push(t('contact') + ': ' + CFG.CONTACT);
  $('#foot').textContent = foot.join(' · ');
}

function render(dir){
  chrome();
  var inFlow = view === 'flow' && S.step >= 0 && S.step < NQ;
  var showRoute = inFlow || view === 'sending' || view === 'fail' || view === 'done';
  $('#route').hidden = !showRoute;
  nav.hidden = !inFlow;
  if (showRoute) {
    var rs = view === 'done' ? NQ : S.step;
    setRoute(rs);
    $('#rCount').textContent = view === 'done' ? '' : (Math.min(S.step, NQ - 1) + 1) + ' / ' + NQ;
  }
  var card = h('section', {class:'card enter' + (dir < 0 ? ' rev' : '')});
  if (view === 'already') message(card, t('already_title'), t('already_lead'));
  else if (view === 'closed') message(card, t('closed_title'), t('closed_lead'));
  else if (view === 'sending') message(card, t('sending'), '');
  else if (view === 'fail') failCard(card);
  else if (view === 'done') doneCard(card);
  else if (S.step < 0) introCard(card);
  else questionCard(card, S.step);
  stage.replaceChildren(card);
  if (inFlow) { btnNext.textContent = S.step === NQ - 1 ? t('submit') : t('next'); refreshNav(); }
  if (dir) { try { window.scrollTo(0, 0); } catch (e) {} var hd = card.querySelector('h1,h2'); if (hd) { hd.setAttribute('tabindex', '-1'); try { hd.focus({preventScroll:true}); } catch (e) {} } }
}

function message(card, title, lead){
  card.append(h('h2', null, title));
  if (lead) card.append(h('p', {class:'lead'}, lead));
}
function introCard(card){
  var resume = S.started && Object.keys(A).length > 0;
  var c1 = h('input', {type:'checkbox', id:'consent1'}), c2 = h('input', {type:'checkbox', id:'consent2'});
  c1.checked = c2.checked = !!S.consent;
  var facts = h('ul', {class:'facts'});
  t('facts').forEach(function(f){ facts.append(h('li', null, f)); });
  var honey = h('input', {type:'text', class:'hp', name:'website', tabindex:'-1', autocomplete:'off', 'aria-hidden':'true'});
  honey.addEventListener('input', function(){ hp = honey.value; });
  var warn = h('p', {class:'mini', role:'status'});
  var go = h('button', {type:'button', class:'btn primary wide'}, resume ? t('resume') : t('start'));
  go.addEventListener('click', function(){
    if (!c1.checked || !c2.checked) { warn.textContent = t('need_consent'); warn.style.color = 'var(--coral)'; fx(go, 'shake'); return; }
    S.consent = true; S.started = true;
    S.step = resume && S.resumeAt >= 0 ? Math.min(S.resumeAt, NQ - 1) : 0;
    save(); render(1);
  });
  card.append(
    h('div', {class:'kicker'}, t('tagline').toUpperCase()),
    h('h1', null, t('intro_title')),
    h('p', {class:'lead'}, t('intro_lead')),
    facts,
    h('div', {class:'notice'}, h('p', null, t('who')), h('p', null, t('privacy'))),
    h('div', {class:'sub'}, h('label', {class:'sub-label', for:'f_nickname'}, t('name_label') + ' ', h('small', null, '(' + t('optional') + ')')),
      textField('nickname', t('name_ph'), {max:30, label:t('name_label')})),
    h('label', {class:'check', for:'consent1'}, c1, h('span', null, t('consent1'))),
    h('label', {class:'check', for:'consent2'}, c2, h('span', null, t('consent2'))),
    honey, warn, go);
}
function questionCard(card, step){
  var id = QIDS[step], q = tq(id);
  card.append(h('div', {class:'kicker'}, 'Q' + (step + 1)), h('h2', null, TITLE[id] ? TITLE[id]() : q.t));
  if (q.h) card.append(h('p', {class:'hint'}, q.h));
  RENDER[id](card);
}
function failCard(card){
  var b = h('button', {type:'button', class:'btn primary wide'}, t('retry'));
  b.addEventListener('click', submit);
  card.append(h('h2', null, t('retry')), h('p', {class:'alert'}, t('send_fail')), b);
}
function doneCard(card){
  card.classList.add('done');
  var d = new Date(), stampDate = d.getFullYear() + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + String(d.getDate()).padStart(2, '0');
  var svgNS = 'http://www.w3.org/2000/svg';
  var svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('class', 'stamp'); svg.setAttribute('viewBox', '0 0 150 150'); svg.setAttribute('aria-hidden', 'true');
  svg.innerHTML = '<circle cx="75" cy="75" r="68" fill="none" stroke="currentColor" stroke-width="3"/>' +
    '<circle cx="75" cy="75" r="58" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 5"/>' +
    '<text x="75" y="52" text-anchor="middle" font-size="12" letter-spacing="3">ARRIVED</text>' +
    '<text x="75" y="86" text-anchor="middle" font-size="27" letter-spacing="2">KOREA</text>' +
    '<text x="75" y="108" text-anchor="middle" font-size="12" letter-spacing="1.5">' + stampDate + '</text>';
  card.append(svg, h('h2', null, t('done_title')), h('p', {class:'lead'}, PREVIEW ? t('preview_done') : t('done_lead')));
  if (PREVIEW) {
    var again = h('button', {type:'button', class:'btn'}, t('restart'));
    again.addEventListener('click', function(){ S.a = A = {}; S.order = {}; S.step = -1; S.elapsed = 0; S.started = false; S.resumeAt = -1; view = 'flow'; save(); render(-1); });
    card.append(again);
  } else {
    var url = CFG.SHARE_URL || (location.origin + location.pathname);
    var copy = h('button', {type:'button', class:'btn'}, t('copy'));
    var link = h('p', {class:'mini', style:'user-select:all;overflow-wrap:anywhere'}, url);
    copy.addEventListener('click', function(){
      var ok = function(){ copy.textContent = t('copied'); setTimeout(function(){ copy.textContent = t('copy'); }, 1800); };
      try { navigator.clipboard.writeText(url).then(ok, sel); } catch (e) { sel(); }
      function sel(){ try { var r = document.createRange(); r.selectNodeContents(link); var s = getSelection(); s.removeAllRanges(); s.addRange(r); } catch (e) {} }
    });
    card.append(h('p', {class:'hint'}, t('share_lead')), copy, link);
  }
}

/* ───────────── 제출 ───────────── */
function buildAnswers(){
  var q8 = {}; Q8.forEach(function(k){ q8[k] = A['q8_' + k]; });
  return {
    q1:A.q1, q1_other:txt(A.q1_other), q2:A.q2, q2_other:txt(A.q2_other), q3:A.q3, q4:A.q4,
    q5:(A.q5 || []).slice(0, 3), q5_other:txt(A.q5_other), q6:A.q6, q6_other:txt(A.q6_other),
    q7:A.q7_gate === 'only' ? 'none' : (A.q7 || []), q7_other:txt(A.q7_other), q7_why:A.q7_gate === 'also' ? txt(A.q7_why) : '',
    q8:q8, q9:A.q9, q9_other:txt(A.q9_other), q9_sure:A.q9 === 'unsure' ? '' : A.q9_sure, q10:A.q10, q10_why:txt(A.q10_why),
    nickname:txt(A.nickname), q11:txt(A.q11)
  };
}
function submit(){
  view = 'sending'; render(1);
  var payload = {action:'submit', answers:buildAnswers(), meta:{lang:S.lang, src:S.src, duration_sec:S.elapsed, client_id:S.cid,
    device:(window.matchMedia && matchMedia('(pointer: coarse)').matches) ? 'mobile' : 'desktop', hp:hp}};
  if (PREVIEW) { setTimeout(function(){ view = 'done'; render(1); }, 700); return; }
  fetch(CFG.API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(payload)})
    .then(function(r){ return r.json(); })
    .then(function(j){
      if (j && j.ok) { LS.set('wk_done', {at:Date.now()}); LS.del('wk_state'); view = 'done'; }
      else if (j && j.error === 'closed') view = 'closed';
      else view = 'fail';
      render(1);
    })
    .catch(function(){ view = 'fail'; render(1); });
}

/* ───────────── 이벤트 ───────────── */
btnNext.addEventListener('click', function(){
  var m = missing(S.step);
  if (m) { fx(btnNext, 'shake'); flash(t(m)); return; }
  if (S.step === NQ - 1) { submit(); return; }
  S.step++; S.resumeAt = S.step; save(); render(1);
});
btnBack.addEventListener('click', function(){ S.step--; if (S.step >= 0) S.resumeAt = S.step; save(); render(-1); });
document.querySelectorAll('#langs button').forEach(function(b){
  b.addEventListener('click', function(){ S.lang = b.getAttribute('data-lang'); save(); render(0); });
});
setInterval(function(){
  if (view === 'flow' && S.step >= 0 && S.step < NQ && !document.hidden) { S.elapsed++; if (S.elapsed % 5 === 0) save(); }
}, 1000);

/* ───────────── 시작 ───────────── */
if (!PREVIEW && LS.get('wk_done')) view = 'already';
if (view === 'flow' && S.step >= 0) { S.resumeAt = Math.min(S.step, NQ - 1); S.step = -1; }   // 다시 열면 소개 화면에서 '이어서 답하기'
drawRoute(routeF = 0);
render(0);
if (!PREVIEW && view === 'flow') {
  fetch(CFG.API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({action:'status'})})
    .then(function(r){ return r.json(); })
    .then(function(j){ if (j && j.ok && j.open === false && view === 'flow') { view = 'closed'; render(0); } })
    .catch(function(){});
}
})();
</script>
