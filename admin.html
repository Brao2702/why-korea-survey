<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>왜 한국 설문 관리</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: overview (all countries) and one page per country, switched by #hash. Each question gets the chart that fits its data shape. */
:root{
  --bg:#EEF7FA; --surface:#FFFFFF; --ink:#14313D; --muted:#58737F; --line:#D3E4EA; --track:#E6F0F4;
  --accent:#12957E; --accent-ink:#0B6B5A; --accent-soft:#DDF4EE; --on-accent:#FFFFFF;
  --sun:#F4B63F; --sun-soft:#FFF2D2; --coral:#E3644F; --coral-soft:#FDE9E5;
  --c-VN:#d94841; --c-CN:#d9871c; --c-MN:#3576d6; --c-NP:#8b5bd6; --c-ETC:#7b8f98;
  --k1:#12957E; --k2:#C98A12; --k3:#C94F72; --k4:#4C5FD5; --k5:#7F8F2F; --k6:#2F8FB8; --k7:#6B7F88;
  --font-body:'Be Vietnam Pro','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --font-display:'Gowun Dodum','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1D24; --surface:#172C36; --ink:#E7F2F5; --muted:#9AB3BD; --line:#2B4653; --track:#22404C;
  --accent:#3CC9AF; --accent-ink:#7FE0CD; --accent-soft:#16393A; --on-accent:#06231D;
  --sun:#F4B63F; --sun-soft:#3A2F14; --coral:#F08878; --coral-soft:#3B211D;
  --c-VN:#ef6a62; --c-CN:#eda03c; --c-MN:#5b97ee; --c-NP:#a583ea; --c-ETC:#9fb2ba;
  --k1:#2FB39A; --k2:#D9A030; --k3:#E06F8E; --k4:#6F80EA; --k5:#9AAB45; --k6:#4BAAD3; --k7:#8DA0A8; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0E1D24; --surface:#172C36; --ink:#E7F2F5; --muted:#9AB3BD; --line:#2B4653; --track:#22404C;
  --accent:#3CC9AF; --accent-ink:#7FE0CD; --accent-soft:#16393A; --on-accent:#06231D;
  --sun:#F4B63F; --sun-soft:#3A2F14; --coral:#F08878; --coral-soft:#3B211D;
  --c-VN:#ef6a62; --c-CN:#eda03c; --c-MN:#5b97ee; --c-NP:#a583ea; --c-ETC:#9fb2ba;
  --k1:#2FB39A; --k2:#D9A030; --k3:#E06F8E; --k4:#6F80EA; --k5:#9AAB45; --k6:#4BAAD3; --k7:#8DA0A8; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.num{font-variant-numeric:tabular-nums}
h1{font-family:var(--font-display);font-weight:400;font-size:26px;margin:0;line-height:1.3}
h2{font-size:15px;font-weight:700;margin:0;text-wrap:balance}
.muted{color:var(--muted)} .small{font-size:12.5px}

.login{max-width:400px;margin:8vh auto 0;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px 24px;display:flex;flex-direction:column;gap:14px}
.field{width:100%;min-height:48px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface)}
.field:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.btn{min-height:40px;padding:0 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.big{min-height:48px;font-size:15px}
.btn[disabled]{opacity:.45;cursor:default}
.err{color:var(--coral);font-size:13.5px;margin:0;min-height:20px}

.head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:700}
.pill.open{background:var(--accent-soft);color:var(--accent-ink)}
.pill.closed{background:var(--coral-soft);color:var(--coral)}
.pill.demo{background:var(--sun-soft);color:var(--ink);border:1px dashed var(--sun)}
.toast{font-size:13px;color:var(--accent-ink);min-height:20px;margin:0}

/* 국가 탭 */
.navbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--line);padding-bottom:12px}
.tab{display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:4px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;color:var(--ink);text-decoration:none}
.tab:hover{border-color:var(--accent)}
.tab[aria-current="page"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tab b{font-weight:500;font-size:12px;opacity:.75}
.sw{width:10px;height:10px;border-radius:3px;flex:none;display:inline-block}
.toggle{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);margin-left:auto;cursor:pointer}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .lbl{font-size:12.5px;color:var(--muted)}
.kpi .val{font-family:var(--font-display);font-size:30px;line-height:1.15}
.kpi .sub{font-size:12px;color:var(--muted)}

/* 국가 카드 */
.ccards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.ccard{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--cc);text-decoration:none;color:var(--ink);transition:transform .15s,box-shadow .15s}
.ccard:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(20,49,61,.10)}
.ccard-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ccard-name{font-weight:700;font-size:16px}
.ccard dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:0;font-size:13px}
.ccard dt{color:var(--muted)} .ccard dd{margin:0;text-align:right;font-weight:600;overflow-wrap:anywhere}
.ccard .go{font-size:12.5px;color:var(--accent-ink);font-weight:600}
.ring{width:58px;height:58px;flex:none}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:860px){.grid{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel.full{grid-column:1/-1}
.panel-h{display:flex;flex-direction:column;gap:2px}
.qn{font-size:11.5px;font-weight:700;letter-spacing:.1em;color:var(--accent-ink)}
.empty{color:var(--muted);font-size:13.5px;margin:0;padding:8px 0}
.note{font-size:12.5px;color:var(--muted);margin:0}
svg.chart{display:block;width:100%;height:auto;overflow:visible}
svg text{font-family:var(--font-body);fill:var(--muted);font-size:11px}
svg .strong{fill:var(--ink);font-weight:700}

.legend{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13px;min-width:0;flex:1}
.legend li{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:8px;align-items:center}
.legend li span:nth-child(2){overflow-wrap:anywhere;line-height:1.3}
.legend li em{font-style:normal;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.legend li em b{color:var(--ink)}
.duo{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.duo > svg, .duo > .waffle{flex:none}
.duo > .legend{flex:1 1 200px}

.waffle{display:grid;grid-template-columns:repeat(10,16px);gap:3px}
.waffle i{width:16px;height:16px;border-radius:3px;display:block;background:var(--track)}

.tree{position:relative;height:230px;border-radius:10px;overflow:hidden}
.tree div{position:absolute;border:2px solid var(--surface);border-radius:8px;padding:6px 8px;color:#fff;font-size:12px;line-height:1.25;overflow:hidden;display:flex;flex-direction:column;gap:1px}
.tree div b{font-size:15px}

.lol{display:flex;flex-direction:column;gap:8px}
.lol-row{display:grid;grid-template-columns:minmax(0,40%) minmax(0,1fr) 92px;gap:10px;align-items:center}
@media (max-width:520px){.lol-row{grid-template-columns:minmax(0,1fr) 84px}.lol-row .lab{grid-column:1/-1}}
.lab{font-size:13.5px;line-height:1.3;overflow-wrap:anywhere}
.lol-t{position:relative;height:16px}
.lol-t::before{content:"";position:absolute;left:0;right:0;top:7px;height:2px;background:var(--track);border-radius:2px}
.lol-t .stem{position:absolute;left:0;top:7px;height:2px;border-radius:2px}
.lol-t .dot{position:absolute;top:1px;width:14px;height:14px;margin-left:-7px;border-radius:50%;border:2px solid var(--surface)}
.lol-t .mid{position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:var(--ink);opacity:.35}
.val{font-size:12.5px;color:var(--muted);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.val b{color:var(--ink)}

.hb{display:flex;flex-direction:column;gap:8px}
.hb-row{display:grid;grid-template-columns:minmax(0,32%) minmax(0,1fr) 92px;gap:10px;align-items:center}
.hb-t{height:14px;border-radius:4px;background:var(--track);overflow:hidden}
.hb-t span{display:block;height:100%;border-radius:4px}

.stack{display:flex;height:30px;border-radius:8px;overflow:hidden;gap:2px}
.stack span{display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;min-width:0;overflow:hidden;white-space:nowrap}

.heat{width:100%;border-collapse:separate;border-spacing:3px;font-size:13px;min-width:560px}
.heat th{font-size:11.5px;color:var(--muted);font-weight:600;text-align:center;padding:4px;line-height:1.25}
.heat th:first-child{text-align:left}
.heat td{text-align:center;padding:9px 4px;border-radius:6px;font-weight:700;font-variant-numeric:tabular-nums}
.heat td:first-child{text-align:left;font-weight:600;background:none;white-space:nowrap}
.heat td.n{background:none;color:var(--muted);font-weight:500}
.scalebar{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted)}
.scalebar i{display:block;width:140px;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--coral),var(--surface) 50%,var(--accent));border:1px solid var(--line)}

.ctitle{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ctitle .flag{width:16px;height:40px;border-radius:5px}
.badge{font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--sun-soft);color:var(--ink);border:1px solid var(--sun)}
.pager{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

.quotes{display:flex;flex-direction:column;gap:8px;max-height:300px;overflow:auto;list-style:none;margin:0;padding:0}
.quotes li{border-left:3px solid var(--line);padding:2px 0 2px 10px;font-size:13.5px;overflow-wrap:anywhere}
.quotes small{display:block;color:var(--muted);font-size:11.5px}

.scroll{overflow:auto}
.tablewrap{overflow:auto;max-height:460px}
table.list{border-collapse:collapse;width:100%;min-width:760px;font-size:13px}
table.list th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:600;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--surface)}
table.list td{padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
tr.x td{opacity:.45;text-decoration:line-through}
tr.x td:last-child{opacity:1;text-decoration:none}
.flagtag{font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px;background:var(--coral-soft);color:var(--coral);margin-right:4px}
.linkbtn{border:0;background:none;color:var(--accent-ink);font-weight:600;font-size:12.5px;cursor:pointer;padding:4px 0;text-decoration:underline}
@media (prefers-reduced-motion: reduce){.ccard{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <section class="login" id="login" hidden>
    <h1>설문 관리</h1>
    <p class="muted" id="loginLead" style="margin:0">「왜 한국이었나요?」 응답을 확인합니다.</p>
    <form id="loginForm" style="display:flex;flex-direction:column;gap:12px">
      <input class="field" id="pw" type="password" inputmode="numeric" autocomplete="current-password" placeholder="관리자 비밀번호" aria-label="관리자 비밀번호">
      <button class="btn primary big" id="loginBtn" type="submit">들어가기</button>
    </form>
    <button class="btn primary big" id="demoBtn" type="button" hidden>예시 데이터로 보기</button>
    <p class="err" id="loginErr" role="alert"></p>
  </section>

  <div id="dash" hidden>
    <div style="display:flex;flex-direction:column;gap:16px">
      <header class="head">
        <div style="display:flex;flex-direction:column;gap:2px;min-width:0">
          <h1>왜 한국이었나요? · 응답 현황</h1>
          <div class="muted small"><span id="statePill" class="pill"></span> <span id="updated"></span></div>
        </div>
        <div class="tools">
          <button class="btn" id="btnRefresh" type="button">새로고침</button>
          <button class="btn" id="btnOpen" type="button">설문 닫기</button>
          <button class="btn" id="btnCsv" type="button">CSV 내려받기</button>
          <button class="btn" id="btnBackup" type="button">지금 백업</button>
          <button class="btn" id="btnLogout" type="button">나가기</button>
        </div>
      </header>
      <p class="toast" id="toast" role="status"></p>
      <nav class="navbar" id="navbar" aria-label="국가별 페이지"></nav>
      <main id="view" style="display:flex;flex-direction:column;gap:16px"></main>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script>
(function(){
'use strict';
var CFG = Object.assign({API_URL:'', TARGET_PER_COUNTRY:30}, window.SURVEY_CONFIG || {});
var PREVIEW = !CFG.API_URL;
var TARGET = Number(CFG.TARGET_PER_COUNTRY) || 30;
var CC = ['VN','CN','MN','NP','ETC'];
var KC = ['var(--k1)','var(--k2)','var(--k3)','var(--k4)','var(--k5)','var(--k6)','var(--k7)'];
var L = {
  q1:{VN:'베트남',CN:'중국',MN:'몽골',NP:'네팔',ETC:'그 외'},
  q2:{d4:'어학연수 (D-4)',d2_ba:'학부 (D-2)',d2_ma:'석사 (D-2)',d2_phd:'박사 (D-2)',exch:'교환·방문',other:'기타'},
  q3:{le2020:'~2020','2021':'2021','2022':'2022','2023':'2023','2024':'2024','2025':'2025','2026':'2026'},
  q4:{moved:'어학연수 → 학위과정으로 옮김',direct:'처음부터 학위과정',plan:'학위과정 진학 계획',noplan:'진학 계획 없음',unsure:'아직 모름'},
  q5:{cost:'학비·생활비가 저렴',schol:'장학금',job:'졸업 후 한국 취업',parttime:'유학 중 아르바이트',culture:'한국 문화·한류',quality:'교육 수준',network:'가족·친구가 한국에 있음',visa:'비자 받기 쉬움',other:'기타'},
  q6:{agency:'유학원',peers:'먼저 온 친구·가족',sns:'SNS·유튜브',univ:'대학 홍보·설명회',gov:'정부 장학 (GKS 등)',school:'본국 학교·선생님',other:'기타'},
  q7:{JP:'일본',US:'미국',AU:'호주',CN:'중국',EU:'유럽',TW:'대만',other:'기타'},
  q8:{study:'수업·학업',cost:'학비·생활비',job:'아르바이트',visa:'비자·체류',korean:'한국어 적응',support:'학교 지원'},
  q9:{kr_job:'한국에서 취업',kr_study:'한국에서 진학',home:'본국 귀국',third:'다른 나라로',unsure:'아직 모름',other:'기타'},
  flag:{fast:'빠름',straight:'같은 점수'}
};
var Q8K = ['study','cost','job','visa','korean','support'];
var Q3K = ['le2020','2021','2022','2023','2024','2025','2026'];
var EXPORT_COLS = ['id','submitted_at','lang','src','device','duration_sec','q1','q1_other','q2','q2_other','q3','q4','q5_1','q5_2','q5_3','q5_other','q6','q6_other','q7','q7_other','q7_why','q8_study','q8_cost','q8_job','q8_visa','q8_korean','q8_support','q9','q9_other','q9_sure','q10','q10_why','nickname','q11','flags','excluded'];

var ROWS = [], OPEN = true, TOKEN = null, SHOW_X = false, DEMO = false, timer = 0;

/* ───────── 도우미 ───────── */
function $(id){ return document.getElementById(id); }
function el(tag, cls, text){ var e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined && text !== null) e.textContent = text; return e; }
var NS = 'http://www.w3.org/2000/svg';
function sv(tag, attrs, parent){ var e = document.createElementNS(NS, tag); for (var k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.append(e); return e; }
function svgBox(w, h, label){ var s = sv('svg', {viewBox:'0 0 ' + w + ' ' + h, class:'chart', role:'img'}); if (label) s.setAttribute('aria-label', label); return s; }
function txt(parent, x, y, s, attrs){ var t = sv('text', Object.assign({x:x, y:y}, attrs || {}), parent); t.textContent = s; return t; }
function tip(node, s){ var t = sv('title', {}, node); t.textContent = s; }
function color(c){ return 'var(--c-' + c + ')'; }
function pct(a, b){ return b ? Math.round(a / b * 100) : 0; }
function fmt1(v){ return (Math.round(v * 10) / 10).toFixed(1); }
function mean(a){ return a.length ? a.reduce(function(s, v){ return s + v; }, 0) / a.length : null; }
function median(a){ if (!a.length) return null; var b = a.slice().sort(function(x, y){ return x - y; }); return b[Math.floor(b.length / 2)]; }
function dur(s){ return s === null ? '–' : Math.floor(s / 60) + '분 ' + (s % 60) + '초'; }
function sstore(k, v){ try { if (v === undefined) return sessionStorage.getItem(k); if (v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch (e) { return null; } }
function panel(host, opts){
  var p = el('section', 'panel' + (opts.full ? ' full' : ''));
  var hd = el('div', 'panel-h');
  if (opts.qn) hd.append(el('span', 'qn', opts.qn));
  hd.append(el('h2', null, opts.title));
  if (opts.note) hd.append(el('span', 'muted small', opts.note));
  p.append(hd); host.append(p); return p;
}
function empty(p, msg){ p.append(el('p', 'empty', msg || '아직 응답이 없습니다.')); }
function counts(rows, key, keys){ var o = {}; keys.forEach(function(k){ o[k] = 0; }); rows.forEach(function(r){ if (r[key] in o) o[r[key]]++; }); return o; }
function nps(rows){ var v = rows.filter(function(r){ return r.q10 !== null; }); if (!v.length) return null;
  var pro = v.filter(function(r){ return r.q10 >= 9; }).length, det = v.filter(function(r){ return r.q10 <= 6; }).length;
  return {score:Math.round((pro - det) / v.length * 100), pro:pro, pas:v.length - pro - det, det:det, n:v.length, mean:mean(v.map(function(r){ return r.q10; }))}; }
function legendList(items, total){
  var ul = el('ul', 'legend');

// 도넛: 한 사람이 하나만 고르는 문항(전체 = 100%)
function donut(host, items, label){
  var total = items.reduce(function(s, it){ return s + it.v; }, 0);
  var shown = items.filter(function(it){ return it.v > 0; });
  var s = svgBox(160, 160, label), cx = 80, cy = 80, R = 70, r = 44, a0 = -Math.PI / 2;
  s.style.width = '160px';
  if (!total) sv('circle', {cx:cx, cy:cy, r:(R + r) / 2, fill:'none', stroke:'var(--track)', 'stroke-width':R - r}, s);
  shown.forEach(function(it){
    var a1 = a0 + it.v / total * Math.PI * 2, node;
    if (it.v === total) node = sv('circle', {cx:cx, cy:cy, r:(R + r) / 2, fill:'none', stroke:it.color, 'stroke-width':R - r}, s);
    else {
      var large = a1 - a0 > Math.PI ? 1 : 0, p = function(rad, a){ return (cx + rad * Math.cos(a)).toFixed(2) + ' ' + (cy + rad * Math.sin(a)).toFixed(2); };
      node = sv('path', {d:'M' + p(R, a0) + ' A' + R + ' ' + R + ' 0 ' + large + ' 1 ' + p(R, a1) + ' L' + p(r, a1) + ' A' + r + ' ' + r + ' 0 ' + large + ' 0 ' + p(r, a0) + ' Z', fill:it.color, stroke:'var(--surface)', 'stroke-width':2}, s);
    }
    tip(node, it.label + ' ' + it.v + '명 (' + pct(it.v, total) + '%)');
    a0 = a1;
  });
  txt(s, cx, cy + 2, String(total), {'text-anchor':'middle', class:'strong', 'font-size':26});
  txt(s, cx, cy + 20, '명', {'text-anchor':'middle'});
  var d = el('div', 'duo'); d.append(s, legendList(shown.length ? shown : items, total)); host.append(d);
}
// 세로 막대: 순서가 있는 연도
function columns(host, items, opts){
  opts = opts || {};
  var W = 460, H = 170, top = 18, bottom = 24, n = items.length, gap = 10, bw = (W - gap * (n - 1)) / n;
  var max = Math.max.apply(null, items.map(function(it){ return it.v; }).concat([1]));
  var s = svgBox(W, H, opts.label);
  sv('line', {x1:0, x2:W, y1:H - bottom, y2:H - bottom, stroke:'var(--line)'}, s);
  items.forEach(function(it, i){
    var x = i * (bw + gap), h = (H - top - bottom) * it.v / max, y = H - bottom - h;
    var b = sv('rect', {x:x, y:y, width:bw, height:Math.max(h, it.v ? 2 : 0), rx:4, fill:it.color || 'var(--accent)'}, s);
    tip(b, it.label + ': ' + it.v + '명');
    if (it.v) txt(s, x + bw / 2, y - 5, String(it.v), {'text-anchor':'middle', class:'strong'});
    txt(s, x + bw / 2, H - 7, it.label, {'text-anchor':'middle'});
  });
  host.append(s);
}
// 와플: 100칸 중 몇 칸인지 (최대잔여법으로 반올림해 합이 100이 되게)
function waffle(host, items){
  var total = items.reduce(function(s, it){ return s + it.v; }, 0);
  var cells = items.map(function(it){ var raw = total ? it.v / total * 100 : 0; return {it:it, n:Math.floor(raw), rem:raw - Math.floor(raw)}; });
  var left = total ? 100 - cells.reduce(function(s, c){ return s + c.n; }, 0) : 0;
  cells.slice().sort(function(a, b){ return b.rem - a.rem; }).slice(0, left).forEach(function(c){ c.n++; });
  var g = el('div', 'waffle'); g.setAttribute('role', 'img');
  g.setAttribute('aria-label', items.map(function(it){ return it.label + ' ' + it.v + '명'; }).join(', '));
  cells.forEach(function(c){ for (var i = 0; i < c.n; i++){ var sq = el('i'); sq.style.background = c.it.color; sq.title = c.it.label + ' ' + c.it.v + '명'; g.append(sq); } });
  while (g.children.length < 100) g.append(el('i'));
  var shown = items.filter(function(it){ return it.v > 0; });
  var d = el('div', 'duo'); d.append(g, legendList(shown.length ? shown : items, total)); host.append(d);
  var note = el('p', 'note', '한 칸 = 응답자의 1%');
  host.append(note);
}
// 트리맵: 면적 = 응답 수 (한 가지만 고르는 문항)
function treemap(host, items){
  var data = items.filter(function(it){ return it.v > 0; }).sort(function(a, b){ return b.v - a.v; });
  var total = data.reduce(function(s, it){ return s + it.v; }, 0);
  var box = el('div', 'tree'); host.append(box);
  var W = 600, H = 230;
  if (!total) { box.remove(); return; }
  var items2 = data.map(function(it){ return {it:it, a:it.v / total * W * H}; });
  function worst(row, side){ var s = 0, mx = 0, mn = Infinity; row.forEach(function(r){ s += r.a; mx = Math.max(mx, r.a); mn = Math.min(mn, r.a); }); return Math.max(side * side * mx / (s * s), s * s / (side * side * mn)); }
  function place(row, x, y, w, h, out){
    var s = row.reduce(function(t, r){ return t + r.a; }, 0);
    if (w >= h) { var cw = s / h, yy = y; row.forEach(function(r){ var hh = r.a / cw; out.push({it:r.it, x:x, y:yy, w:cw, h:hh}); yy += hh; }); return [x + cw, y, w - cw, h]; }
    var rh = s / w, xx = x; row.forEach(function(r){ var ww = r.a / rh; out.push({it:r.it, x:xx, y:y, w:ww, h:rh}); xx += ww; }); return [x, y + rh, w, h - rh];
  }
  var out = [], row = [], rest = items2.slice(), x = 0, y = 0, w = W, h = H;
  while (rest.length) {
    var side = Math.min(w, h);
    if (!row.length || worst(row.concat([rest[0]]), side) <= worst(row, side)) row.push(rest.shift());
    else { var r = place(row, x, y, w, h, out); x = r[0]; y = r[1]; w = r[2]; h = r[3]; row = []; }
  }
  if (row.length) place(row, x, y, w, h, out);
  out.forEach(function(o){
    var d = el('div'); d.style.left = (o.x / W * 100) + '%'; d.style.top = (o.y / H * 100) + '%'; d.style.width = (o.w / W * 100) + '%'; d.style.height = (o.h / H * 100) + '%'; d.style.background = o.it.color;
    d.title = o.it.label + ' ' + o.it.v + '명 (' + pct(o.it.v, total) + '%)';
    if (o.w > 70 && o.h > 44) { d.append(el('b', null, o.it.v + '명 · ' + pct(o.it.v, total) + '%'), el('span', null, o.it.label)); }
    else if (o.w > 34 && o.h > 22) d.append(el('b', null, String(o.it.v)));
    box.append(d);
  });
  host.append(legendList(data, total));
}

// 레이더: 같은 1~5점 척도의 여러 항목 (국가 vs 전체 평균)
function radar(host, series){
  var W = 360, H = 270, cx = 180, cy = 132, R = 92, n = Q8K.length;
  var s = svgBox(W, H, '만족도 레이더');
  function pt(i, v){ var a = -Math.PI / 2 + i * 2 * Math.PI / n; return [cx + Math.cos(a) * R * v / 5, cy + Math.sin(a) * R * v / 5]; }
  for (var lv = 1; lv <= 5; lv++) {
    sv('polygon', {points:Q8K.map(function(k, i){ return pt(i, lv).join(','); }).join(' '), fill:'none', stroke:'var(--line)', 'stroke-width':lv === 5 ? 1.5 : 1}, s);
    txt(s, cx + 3, cy - R * lv / 5 + 4, String(lv), {'font-size':9.5});
  }
  Q8K.forEach(function(k, i){
    var e = pt(i, 5); sv('line', {x1:cx, y1:cy, x2:e[0], y2:e[1], stroke:'var(--line)'}, s);
    var l = pt(i, 5.95), c = Math.cos(-Math.PI / 2 + i * 2 * Math.PI / n);
    txt(s, l[0], l[1] + 4, L.q8[k], {'text-anchor':Math.abs(c) < 0.2 ? 'middle' : c > 0 ? 'start' : 'end', class:'strong', 'font-size':11.5});
  });
  series.forEach(function(se){
    if (se.values.some(function(v){ return v === null; })) return;
    var pts = se.values.map(function(v, i){ return pt(i, v).join(','); }).join(' ');
    sv('polygon', {points:pts, fill:se.fill || 'none', 'fill-opacity':se.fill ? 0.22 : 0, stroke:se.color, 'stroke-width':2.2, 'stroke-dasharray':se.dash || ''}, s);
    se.values.forEach(function(v, i){ var p = pt(i, v); var c = sv('circle', {cx:p[0], cy:p[1], r:se.dash ? 2.5 : 4, fill:se.color}, s); tip(c, se.name + ' · ' + L.q8[Q8K[i]] + ' ' + fmt1(v)); });
  });
  host.append(s);
  var ul = el('ul', 'legend'); ul.style.flexDirection = 'row'; ul.style.flexWrap = 'wrap'; ul.style.gap = '6px 16px';
  series.forEach(function(se){ var li = el('li'); li.style.display = 'flex'; li.style.gap = '6px'; var sw = el('span', 'sw'); sw.style.background = se.color; if (se.dash) { sw.style.background = 'none'; sw.style.border = '2px dashed ' + se.color; } li.append(sw, el('span', null, se.name)); ul.append(li); });
  host.append(ul);
}
// 게이지: NPS (-100 ~ +100)

// 누적 응답 추이 (국가별 선)
function cumLine(host, rows){
  var days = rows.map(function(r){ return r.submitted_at.slice(0, 10); }).filter(Boolean).sort();
  if (!days.length) return empty(host);
  var seq = [], cur = new Date(days[0] + 'T00:00:00Z'), end = new Date(days[days.length - 1] + 'T00:00:00Z');
  while (cur <= end && seq.length < 120) { seq.push(cur.toISOString().slice(0, 10)); cur = new Date(cur.getTime() + 86400000); }
  if (seq.length === 1) seq.unshift(new Date(new Date(seq[0] + 'T00:00:00Z').getTime() - 86400000).toISOString().slice(0, 10));
  var W = 640, H = 230, l = 30, r = 62, t = 12, b = 26;
  var series = CC.map(function(c){ var acc = 0; return {c:c, pts:seq.map(function(d){ acc += rows.filter(function(x){ return x.q1 === c && x.submitted_at.slice(0, 10) === d; }).length; return acc; })}; }).filter(function(se){ return se.pts[se.pts.length - 1] > 0; });
  var max = Math.max.apply(null, series.map(function(se){ return se.pts[se.pts.length - 1]; }).concat([TARGET]));
  var X = function(i){ return l + i * (W - l - r) / (seq.length - 1); }, Y = function(v){ return H - b - v / max * (H - t - b); };
  var s = svgBox(W, H, '국가별 누적 응답 수');
  [0, Math.round(max / 2), max].forEach(function(v){ sv('line', {x1:l, x2:W - r, y1:Y(v), y2:Y(v), stroke:'var(--line)'}, s); txt(s, l - 6, Y(v) + 4, String(v), {'text-anchor':'end'}); });
  if (TARGET <= max) { sv('line', {x1:l, x2:W - r, y1:Y(TARGET), y2:Y(TARGET), stroke:'var(--ink)', 'stroke-dasharray':'4 4', opacity:.5}, s); txt(s, W - r + 4, Y(TARGET) + 4, '목표 ' + TARGET); }
  [0, Math.floor((seq.length - 1) / 2), seq.length - 1].filter(function(v, i, a){ return a.indexOf(v) === i; }).forEach(function(i){ txt(s, X(i), H - 8, seq[i].slice(5).replace('-', '/'), {'text-anchor':i === 0 ? 'start' : i === seq.length - 1 ? 'end' : 'middle'}); });
  var labels = [];
  series.forEach(function(se){
    sv('polyline', {points:se.pts.map(function(v, i){ return X(i) + ',' + Y(v); }).join(' '), fill:'none', stroke:color(se.c), 'stroke-width':2.5, 'stroke-linejoin':'round'}, s);
    var lv = se.pts[se.pts.length - 1]; var dot = sv('circle', {cx:X(seq.length - 1), cy:Y(lv), r:4, fill:color(se.c)}, s); tip(dot, L.q1[se.c] + ' ' + lv + '명');
    labels.push({c:se.c, y:Y(lv), v:lv});
  });
  labels.sort(function(a, b){ return a.y - b.y; });
  for (var i = 1; i < labels.length; i++) if (labels[i].y - labels[i - 1].y < 13) labels[i].y = labels[i - 1].y + 13;
  var over = labels.length ? labels[labels.length - 1].y - (H - b) : 0;
  if (over > 0) labels.forEach(function(lb){ lb.y -= over; });
  labels.forEach(function(lb){ txt(s, W - r + 8, lb.y + 4, L.q1[lb.c] + ' ' + lb.v, {fill:color(lb.c), 'font-weight':700}); });
  host.append(s);
}

/* ───────── 서버 ───────── */
function api(action, body){
  return fetch(CFG.API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(Object.assign({action:action, token:TOKEN}, body || {}))}).then(function(r){ return r.json(); });
}
function setBusy(b){ ['btnRefresh','btnOpen','btnBackup'].forEach(function(id){ $(id).disabled = b || DEMO; }); $('btnCsv').disabled = DEMO; }
function toast(m){ $('toast').textContent = m || ''; }
function show(which){ $('login').hidden = which !== 'login'; $('dash').hidden = which !== 'dash'; }
function load(keep){
  if (DEMO) { draw(keep); return; }
  setBusy(true);
  api('admin_list').then(function(j){
    setBusy(false);
    if (!j.ok) { if (j.error === 'auth') logout('로그인 시간이 끝났습니다. 다시 들어가 주세요.'); else toast('불러오지 못했습니다. 잠시 뒤 새로고침해 주세요.'); return; }
    ROWS = j.rows.map(norm); OPEN = j.open !== false; draw(keep);
  }).catch(function(){ setBusy(false); toast('서버에 연결하지 못했습니다. 인터넷 연결을 확인해 주세요.'); });
}
function logout(msg){ TOKEN = null; sstore('wk_admin', null); clearInterval(timer); ROWS = []; DEMO = false; show('login'); $('loginErr').textContent = msg || ''; }
function toggleExclude(r){
  var next = !r.excluded;
  if (DEMO) { r.excluded = next; draw(true); return; }
  api('admin_exclude', {id:r.id, excluded:next}).then(function(j){ if (j.ok) { r.excluded = next; draw(true); } else if (j.error === 'auth') logout('로그인 시간이 끝났습니다. 다시 들어가 주세요.'); else toast('바꾸지 못했습니다.'); }).catch(function(){ toast('서버에 연결하지 못했습니다.'); });
}
function csv(){
  var esc = function(v){ v = v === null || v === undefined ? '' : String(v); return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  var lines = [EXPORT_COLS.join(',')].concat(ROWS.map(function(r){ return EXPORT_COLS.map(function(c){ return esc(c === 'excluded' ? (r.excluded ? '1' : '') : r[c]); }).join(','); }));
  var blob = new Blob(['﻿' + lines.join('\r\n')], {type:'text/csv;charset=utf-8'});
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'why-korea-responses_' + new Date(Date.now() + 9 * 3600000).toISOString().slice(0, 10) + '.csv';
  document.body.append(a); a.click(); a.remove(); setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
  toast('CSV 파일을 내려받았습니다 (' + ROWS.length + '건).');
}

$('loginForm').addEventListener('submit', function(e){
  e.preventDefault();
  var pw = $('pw').value; if (!pw) return;
  $('loginBtn').disabled = true; $('loginErr').textContent = '';
  api('admin_login', {password:pw}).then(function(j){
    $('loginBtn').disabled = false;
    if (j.ok) { TOKEN = j.token; sstore('wk_admin', TOKEN); $('pw').value = ''; start(); return; }
    $('loginErr').textContent = j.error === 'bad_password' ? '비밀번호가 맞지 않습니다. 남은 시도 ' + j.left + '회.'
      : j.error === 'locked' ? '여러 번 틀려 잠겼습니다. ' + j.minutes + '분 뒤에 다시 시도해 주세요.'
      : j.error === 'no_password_set' ? '비밀번호가 아직 등록되지 않았습니다. Apps Script의 스크립트 속성에 ADMIN_PASSWORD를 추가하세요.'
      : '들어가지 못했습니다. 잠시 뒤 다시 시도해 주세요.';
  }).catch(function(){ $('loginBtn').disabled = false; $('loginErr').textContent = '서버에 연결하지 못했습니다. config.js의 API_URL과 인터넷 연결을 확인해 주세요.'; });
});
$('demoBtn').addEventListener('click', function(){ DEMO = true; ROWS = demoRows().map(norm); OPEN = true; show('dash'); setBusy(false); draw(false); });
$('btnRefresh').addEventListener('click', function(){ toast(''); load(true); });
$('btnLogout').addEventListener('click', function(){ logout(''); });
$('btnCsv').addEventListener('click', csv);
$('btnOpen').addEventListener('click', function(){
  setBusy(true);
  api('admin_set_open', {open:!OPEN}).then(function(j){ setBusy(false); if (j.ok) { OPEN = j.open; draw(true); toast(OPEN ? '설문을 다시 열었습니다.' : '설문을 닫았습니다. 새 응답을 받지 않습니다.'); } else if (j.error === 'auth') logout('로그인 시간이 끝났습니다. 다시 들어가 주세요.'); }).catch(function(){ setBusy(false); toast('서버에 연결하지 못했습니다.'); });
});
$('btnBackup').addEventListener('click', function(){
  setBusy(true); toast('백업하는 중…');
  api('admin_backup').then(function(j){ setBusy(false); toast(j.ok ? 'Google Drive에 백업했습니다: ' + j.name : '백업하지 못했습니다.'); }).catch(function(){ setBusy(false); toast('서버에 연결하지 못했습니다.'); });
});
function start(){
  show('dash'); setBusy(false); draw(false); load(false);
  clearInterval(timer);
  timer = setInterval(function(){ if (!document.hidden && TOKEN) load(true); }, 60000);
}
if (PREVIEW) {
  $('loginForm').hidden = true; $('demoBtn').hidden = false;
  $('loginLead').textContent = '미리보기 모드입니다. 아직 서버(API_URL)가 연결되지 않아 예시 데이터로 화면만 확인할 수 있습니다.';
  show('login');
} else {
  TOKEN = sstore('wk_admin') || null;
  if (TOKEN) start(); else show('login');
}
})();
</script>
</body>
</html>
